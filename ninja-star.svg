<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Server/terminal window frame -->
  <rect x="1" y="1" width="22" height="22" rx="2.5" ry="2.5"
        fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Title bar divider -->
  <line x1="1.8" y1="7" x2="22.2" y2="7"
        stroke="currentColor" stroke-width="0.8"/>
  <!-- Window control dots -->
  <circle cx="4"   cy="4.5" r="0.85" fill="currentColor"/>
  <circle cx="6.8" cy="4.5" r="0.85" fill="currentColor"/>
  <circle cx="9.6" cy="4.5" r="0.85" fill="currentColor"/>
  <!-- Pinwheel shuriken centered at (12, 15), outer radius 5 -->
  <!-- Blade pointing RIGHT -->
  <polygon points="17,15   12.5,12.7  9.7,15.5"  fill="currentColor"/>
  <!-- Blade pointing UP -->
  <polygon points="12,10   9.7,14.5   12.5,17.3" fill="currentColor"/>
  <!-- Blade pointing LEFT -->
  <polygon points="7,15    11.5,17.3  14.3,14.5" fill="currentColor"/>
  <!-- Blade pointing DOWN -->
  <polygon points="12,20   14.3,15.5  11.5,12.7" fill="currentColor"/>
</svg>
